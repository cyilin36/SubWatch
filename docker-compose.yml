services:
  subwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: subwatch:latest
    container_name: subwatch
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      SUBWATCH_WEB_DIR: /app/web
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

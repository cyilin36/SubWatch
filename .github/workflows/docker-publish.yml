# Build and publish the SubWatch image to GitHub Container Registry (GHCR)
# whenever a version tag is pushed.
#
# Tag rules (a leading "v" is optional and never part of the image tag):
#   v1.2.3          -> stable release: push 1.2.3 and latest
#   1.2.3           -> same
#   v1.2.3-beta.1   -> pre-release:    push 1.2.3-beta.1 only, never latest
#   1.2.3-rc.1      -> same
#
# Anything that is not x.y.z or x.y.z-suffix makes the "Parse tag" step fail
# instead of publishing a surprising image tag.
#
# Published image: ghcr.io/<owner>/<repo>  (e.g. ghcr.io/cyilin36/subwatch)

name: Publish Docker image

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

# GITHUB_TOKEN needs packages:write to push to ghcr.io.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Add ",linux/arm64" for multi-arch builds (QEMU setup below handles it).
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          raw="${GITHUB_REF_NAME}"
          version="${raw#v}"   # docker image tags do not carry the leading "v"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '${raw}' is not a valid version (expected x.y.z or x.y.z-suffix)."
            exit 1
          fi

          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase

          # A "-" after the version core marks a pre-release: build the image,
          # but never move "latest" (or any stable tag) to it.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            tags=$(printf '%s\n' "${image}:${version}")
          else
            prerelease=false
            tags=$(printf '%s\n' "${image}:${version}" "${image}:latest")
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "image=${image}"
            echo "tags<<DOCKER_TAGS_EOF"
            echo "${tags}"
            echo "DOCKER_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${image} (prerelease=${prerelease}):"
          echo "${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.title=SubWatch
            org.opencontainers.image.description=Self-hosted subscription tracker, quota monitor and reminder
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
